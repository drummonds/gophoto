# https://taskfile.dev

version: '3'

vars:
  GOK_NAME: hello

tasks:
  fmt:
    desc: Format Go source code
    cmds:
      - go fmt ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  check:
    desc: Run fmt, vet, and test
    cmds:
      - task: fmt
      - task: vet
      - task: test

  local:
    desc: Run gophoto on this machine's frame buffer
    cmds:
      - go run .

  gok:add:
    desc: Add gophoto to the gokrazy instance
    cmds:
      - gok add -i {{.GOK_NAME}} git.bytestone.uk/hum3/gophoto

  gok:update:
    desc: Rebuild and push the gokrazy instance over the network
    cmds:
      - CGO_ENABLED=0 GOARCH=arm64 gok -i {{.GOK_NAME}} update

  gok:image:
    desc: Write a full gokrazy image to x.img
    cmds:
      - CGO_ENABLED=0 GOARCH=arm64 gok -i {{.GOK_NAME}} overwrite --full x.img --target_storage_bytes=1258299392

  docs:build:
    desc: Build documentation (markdown to HTML)
    cmds:
      - task-plus md2html --file index.md --dst docs
      - task-plus md2html --file README.md --dst docs
      - task-plus md2html --file CHANGELOG.md --dst docs
      - task-plus md2html --file ROADMAP.md --dst docs

  clean:
    desc: Remove generated files
    cmds:
      - rm -f docs/*.html x.img
